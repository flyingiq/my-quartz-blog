name: Deploy Quartz to VPS
on:
  push:
    branches: [ v4 ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Deploy to Optimization Chicken
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-avz --delete --no-perms --no-owner --no-group"
          SOURCE: "public/"
          REMOTE_HOST: "38.165.45.74"
          REMOTE_USER: "root"
          TARGET: "/var/www/quartz"
          REMOTE_PORT: "2222"